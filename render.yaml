services:
  - type: web
    name: bookmark-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main

  - type: web
    name: bookmark-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    branch: main
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false